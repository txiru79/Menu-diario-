<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menú Diario</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f855a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-title" content="Menú Diario">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f8f5;--card:#fff;--tx:#1f2a22;--mut:#6b7a70;--pri:#2f855a;--pri2:#e3f1e8;--bd:#dfe6e0;--hoy:#f2a33a}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b231e;--tx:#e8efe9;--mut:#9aa89e;--pri:#4cb07f;--pri2:#223a2c;--bd:#2b362f;--hoy:#e0953a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header{gap:6px}
header h1{font-size:.9rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{white-space:nowrap}
.sheet input[type=text],.sheet input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
header select,header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 10px;font-size:.9rem}
header select option{color:#000}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block}
.day{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.day.hoy{border:2px solid var(--hoy)}
.day h3{margin:0 0 6px;font-size:1rem}
.slot{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.slot:first-of-type{border-top:0}
.info{flex:1;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.nm{font-weight:600}
.mn{font-size:.8rem;color:var(--mut)}
.pn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:transparent;font-size:1.05rem;opacity:.45}
.pn.on{background:var(--pri2);border-color:var(--pri);opacity:1}
.sw:disabled{opacity:.3}
.slot.fijo .nm{color:var(--pri)}
.sw{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--pri2);color:var(--pri);font-size:1.2rem}
.cat{margin:14px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--pri);font-weight:700}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.it input{width:22px;height:22px;accent-color:var(--pri)}
.it.ok span{text-decoration:line-through;color:var(--mut)}
.it span{flex:1}.it b{font-weight:600;color:var(--mut);font-size:.9rem}
.bar{display:flex;gap:8px;margin-bottom:6px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:.95rem}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=search]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;margin-bottom:8px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 4px;background:none;border:0;color:var(--mut);font-size:.8rem}
nav button span{display:block;font-size:1.3rem}
nav button.on{color:var(--pri);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px}
.sheet h4{margin:14px 0 6px}
.sheet ul,.sheet ol{margin:0;padding-left:20px;line-height:1.5}
.x{float:right;border:0;background:var(--pri2);color:var(--pri);width:38px;height:38px;border-radius:50%;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.hint{color:var(--mut);font-size:.85rem;margin:2px 0 10px}
.chips{display:flex;gap:8px;margin-bottom:6px;overflow-x:auto}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:.9rem}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.rc.ban{opacity:.55}
.tot{display:flex;justify-content:space-between;gap:12px;background:var(--pri2);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.tot .big{font-size:1.5rem;font-weight:700;color:var(--pri)}
.tot .pp{text-align:right;flex:none}
.sheet label{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 4px}
.sheet textarea,.sheet select.fs{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;font-family:inherit}
.fr{display:flex;gap:8px}.fr>div{flex:1;min-width:0}
.ir{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ir .in{flex:1;min-width:0}
.ir input,.ir select{padding:10px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.sheet .ir .iq{width:64px;flex:none}.sheet .ir .iu{width:58px;flex:none}.sheet .ir .in{width:auto}
.ix{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--pri2);color:var(--pri)}
.pres{display:block;width:100%;text-align:left;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;font-size:.92rem;margin-bottom:8px}
.pres.ok{border-color:var(--pri);color:var(--pri)}
.pres.no{border-color:#d9534f;color:#d9534f}
.tot .big{white-space:nowrap}
.it .pr{font-size:.85rem;color:var(--pri);font-weight:600;min-width:58px;text-align:right}
.itl{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.it .itl span{flex:1}
.tg{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--pri2);color:var(--pri);font-size:1.1rem}
.it.casa{opacity:.7}
/* ===== Temas, fondo con comidas y cristal ===== */
:root{--bg:#f7f8f6;--card:rgba(255,255,255,.82);--solid:#fff;--tx:#1f2a22;--mut:#66756b;--bd:rgba(0,0,0,.09);--pri:#1f9d63;--pri2:#def5e8;--g1:#2fb36f;--g2:#159a9c;--hoy:#f2a33a;--bgimg:linear-gradient(160deg,#e3f7ec,#fff6df 55%,#e0f2ff);--emo:.55}
html[data-tema=mandarina]{--pri:#e2650c;--pri2:#ffe9d2;--g1:#ff8a2b;--g2:#ffb02e;--hoy:#2fa56a;--bgimg:linear-gradient(160deg,#fff0dc,#fff9e0 55%,#ffe4e1)}
html[data-tema=uva]{--pri:#7a45d1;--pri2:#ece2ff;--g1:#8b5cf6;--g2:#ec5fa5;--hoy:#f2a33a;--bgimg:linear-gradient(160deg,#efe6ff,#ffe8f3 55%,#e3ecff)}
@media (prefers-color-scheme:dark){
  :root{--bg:#151917;--card:rgba(28,33,30,.8);--solid:#1d2220;--tx:#f0f1ec;--mut:#aab3ad;--bd:rgba(255,255,255,.12);--pri:#4cc58a;--pri2:rgba(255,255,255,.1);--bgimg:linear-gradient(160deg,#0e2018,#1b1a10 55%,#0d1b24);--emo:.32}
  html[data-tema]{--pri2:rgba(255,255,255,.1)}
  html[data-tema=mandarina]{--pri:#ff9442;--bgimg:linear-gradient(160deg,#2a190b,#261d0b 55%,#2a1212)}
  html[data-tema=uva]{--pri:#a98bff;--bgimg:linear-gradient(160deg,#1a1030,#2a1024 55%,#10182e)}
}
html{background:var(--bg)}
body{background:transparent}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bgimg);pointer-events:none}
#bg span{position:absolute;opacity:var(--emo);line-height:1;animation:flota 12s ease-in-out infinite alternate}
#bg.off span{display:none}
@keyframes flota{from{transform:translateY(-10px) rotate(-6deg)}to{transform:translateY(12px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){#bg span{animation:none}}
header{background:linear-gradient(120deg,var(--g1),var(--g2));box-shadow:0 4px 16px rgba(0,0,0,.15)}
header h1{font-size:1rem;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.25)}
header select,header button{background:rgba(255,255,255,.25);font-weight:600}
.day,.it,.rc,.btn,.chip,.pres,input[type=search],nav{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.day{border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.07)}
.day h3{color:var(--pri)}
.day.hoy{box-shadow:0 6px 22px rgba(0,0,0,.12)}
.tot{background:linear-gradient(135deg,var(--pri2),var(--card));border-radius:20px;box-shadow:0 6px 18px rgba(0,0,0,.07)}
.it,.rc{border-radius:16px}
.sheet{background:var(--solid)}
.btn,.pres,.chip{border-radius:14px}
.btn.p,.chip.on{background:linear-gradient(120deg,var(--g1),var(--g2));border-color:transparent}
nav{border-top:0;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
nav button.on{background:var(--pri2);border-radius:16px;margin:4px}
.tema{display:flex;gap:8px;margin:10px 0}
.tema .btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px}
.tema .btn span{font-size:1.8rem}
.tema .btn.on{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<header>
  <h1>Menú</h1>
  <select id="pers" aria-label="Personas"></select>
  <button id="nuevo">Nuevo menú</button>
  <button id="nube" aria-label="Compartir con la familia" title="Compartir con la familia">☁️</button>
</header>
<main>
  <section id="vMenu" class="view on"></section>
  <section id="vCompra" class="view"></section>
  <section id="vRecetas" class="view"></section>
</main>
<nav>
  <button data-v="vMenu" class="on"><span>🍽️</span>Menú</button>
  <button data-v="vCompra"><span>🛒</span>Compra</button>
  <button data-v="vRecetas"><span>📖</span>Recetas</button>
</nav>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
const FV='Fruta y verdura',CA='Carne',PE='Pescado',LA='Huevos y lácteos',PA='Pan y tortillas',DE='Arroz, pasta y legumbres',CO='Conservas y salsas',CG='Congelados';
const ORDEN=[FV,CA,PE,LA,PA,DE,CO,CG];
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

const R=[
// PRIMEROS (comida)
{id:1,m:'p',t:'legumbre',e:'🥘',n:"Lentejas con verduras",min:40,i:[["Lentejas pardinas Hacendado",180,'g',DE],["Zanahoria",2,'ud',FV],["Cebolla",1,'ud',FV],["Pimiento rojo",1,'ud',FV],["Patata",1,'ud',FV],["Ajo",2,'ud',FV]],s:["Sofríe cebolla, ajo y pimiento 5 minutos.","Añade zanahoria, patata y lentejas con agua que las cubra.","Cuece 30 minutos a fuego medio."]},
{id:2,m:'p',t:'legumbre',e:'🥬',n:"Garbanzos con espinacas",min:20,i:[["Garbanzos cocidos Hacendado",450,'g',DE],["Espinacas frescas (bolsa)",300,'g',FV],["Cebolla",1,'ud',FV],["Ajo",2,'ud',FV]],s:["Sofríe cebolla y ajo.","Añade las espinacas y cocina 3 minutos.","Incorpora los garbanzos escurridos y cuece 10 minutos."]},
{id:3,m:'p',t:'legumbre',e:'🫘',n:"Alubias blancas con verduras",min:30,i:[["Alubias blancas cocidas Hacendado",450,'g',DE],["Puerro",1,'ud',FV],["Zanahoria",2,'ud',FV],["Tomate triturado Hacendado",200,'g',CO],["Ajo",1,'ud',FV]],s:["Sofríe puerro, zanahoria y ajo 8 minutos.","Añade el tomate y las alubias escurridas.","Cuece 15 minutos a fuego bajo."]},
{id:4,m:'p',t:'arroz_pasta',e:'🍚',n:"Arroz integral con verduras",min:40,i:[["Arroz integral Hacendado",200,'g',DE],["Pimiento verde",1,'ud',FV],["Calabacín",1,'ud',FV],["Cebolla",1,'ud',FV],["Zanahoria",1,'ud',FV]],s:["Sofríe las verduras picadas 8 minutos.","Añade el arroz y cubre con agua el doble de volumen.","Cuece 30 minutos a fuego bajo."]},
{id:5,m:'p',t:'arroz_pasta',e:'🍝',n:"Espaguetis integrales con tomate",min:20,i:[["Espaguetis integrales Hacendado",225,'g',DE],["Tomate triturado Hacendado",300,'g',CO],["Cebolla",1,'ud',FV],["Ajo",1,'ud',FV]],s:["Cuece la pasta según el paquete.","Sofríe cebolla y ajo y añade el tomate 10 minutos.","Mezcla la salsa con la pasta."]},
{id:11,m:'p',t:'arroz_pasta',e:'🥘',n:"Arroz con verduras",min:35,i:[["Arroz redondo Hacendado",200,'g',DE],["Judías verdes",200,'g',FV],["Pimiento rojo",1,'ud',FV],["Tomate",2,'ud',FV],["Guisantes congelados",150,'g',CG]],s:["Sofríe pimiento y tomate rallado.","Añade las judías, los guisantes y el arroz.","Cubre con agua el doble de volumen y cuece 18 minutos."]},
{id:12,m:'p',t:'arroz_pasta',e:'🍝',n:"Macarrones integrales con verduras",min:30,i:[["Macarrones integrales Hacendado",225,'g',DE],["Calabacín",1,'ud',FV],["Zanahoria",1,'ud',FV],["Tomate triturado Hacendado",300,'g',CO]],s:["Cuece los macarrones.","Sofríe calabacín y zanahoria rallados 8 minutos.","Añade el tomate 10 minutos y mezcla con la pasta."]},
{id:31,m:'p',t:'legumbre',e:'🥘',n:"Lentejas con calabaza",min:40,i:[["Lentejas pardinas Hacendado",180,'g',DE],["Calabaza troceada",300,'g',FV],["Cebolla",1,'ud',FV],["Zanahoria",1,'ud',FV],["Ajo",2,'ud',FV]],s:["Sofríe cebolla, ajo y zanahoria 5 minutos.","Añade la calabaza y las lentejas con agua que las cubra.","Cuece 30 minutos a fuego medio."]},
{id:32,m:'p',t:'legumbre',e:'🫘',n:"Potaje de garbanzos con verduras",min:25,i:[["Garbanzos cocidos Hacendado",450,'g',DE],["Judías verdes",200,'g',FV],["Zanahoria",2,'ud',FV],["Patata",1,'ud',FV],["Cebolla",1,'ud',FV]],s:["Sofríe la cebolla y añade zanahoria, patata y judías en trozos.","Cubre con agua y cuece 15 minutos.","Incorpora los garbanzos escurridos y cuece 8 minutos más."]},
{id:33,m:'p',t:'legumbre',e:'🫘',n:"Alubias pintas con verduras",min:30,i:[["Alubias pintas cocidas Hacendado",450,'g',DE],["Pimiento verde",1,'ud',FV],["Cebolla",1,'ud',FV],["Zanahoria",1,'ud',FV],["Ajo",1,'ud',FV]],s:["Sofríe cebolla, pimiento, zanahoria y ajo 8 minutos.","Añade las alubias escurridas y un vaso de agua.","Cuece 15 minutos a fuego bajo."]},
{id:34,m:'p',t:'legumbre',e:'🥘',n:"Lentejas con arroz y verduras",min:40,i:[["Lentejas pardinas Hacendado",120,'g',DE],["Arroz redondo Hacendado",60,'g',DE],["Zanahoria",1,'ud',FV],["Cebolla",1,'ud',FV],["Pimiento rojo",1,'ud',FV]],s:["Sofríe cebolla, pimiento y zanahoria.","Añade las lentejas con agua y cuece 20 minutos.","Echa el arroz y cuece 15 minutos más."]},
{id:38,m:'p',t:'arroz_pasta',e:'🍚',n:"Arroz con tomate y guisantes",min:30,i:[["Arroz redondo Hacendado",200,'g',DE],["Tomate triturado Hacendado",200,'g',CO],["Guisantes congelados",150,'g',CG],["Cebolla",1,'ud',FV]],s:["Sofríe la cebolla y añade el tomate 5 minutos.","Incorpora el arroz y los guisantes y cubre con agua.","Cuece 18 minutos."]},
{id:39,m:'p',t:'arroz_pasta',e:'🍝',n:"Pasta integral con brócoli y ajo",min:25,i:[["Espaguetis integrales Hacendado",225,'g',DE],["Brócoli",300,'g',FV],["Ajo",2,'ud',FV]],s:["Cuece la pasta con el brócoli en trozos los últimos 5 minutos.","Dora el ajo laminado 1 minuto en aceite de oliva.","Mezcla todo."]},
{id:40,m:'p',t:'arroz_pasta',e:'🍚',n:"Arroz integral con champiñones",min:40,i:[["Arroz integral Hacendado",200,'g',DE],["Champiñones laminados",250,'g',FV],["Cebolla",1,'ud',FV],["Ajo",1,'ud',FV]],s:["Sofríe cebolla, ajo y champiñones 8 minutos.","Añade el arroz y cubre con agua el doble de volumen.","Cuece 30 minutos a fuego bajo."]},
{id:61,m:'p',t:'verdura',e:'🥣',n:"Crema de verduras",min:30,i:[["Puerro",1,'ud',FV],["Zanahoria",2,'ud',FV],["Calabacín",1,'ud',FV],["Patata",1,'ud',FV]],s:["Pocha el puerro 5 minutos.","Añade el resto en trozos y cubre con agua.","Cuece 20 minutos y tritura."]},
{id:62,m:'p',t:'verdura',e:'🫛',n:"Menestra de verduras",min:25,i:[["Judías verdes",200,'g',FV],["Guisantes congelados",150,'g',CG],["Zanahoria",2,'ud',FV],["Cebolla",1,'ud',FV]],s:["Cuece zanahoria y judías en trozos 10 minutos.","Sofríe la cebolla y añade las verduras.","Incorpora los guisantes y cuece 5 minutos."]},
{id:63,m:'p',t:'verdura',e:'🥔',n:"Judías verdes con patata",min:25,i:[["Judías verdes",400,'g',FV],["Patata",2,'ud',FV],["Ajo",1,'ud',FV]],s:["Cuece judías y patata en trozos 15 minutos.","Escurre y aliña con ajo dorado y aceite de oliva."]},
{id:64,m:'p',t:'verdura',e:'🥗',n:"Ensalada mixta",min:10,i:[["Lechuga",1,'ud',FV],["Tomate",2,'ud',FV],["Pepino",1,'ud',FV],["Zanahoria",1,'ud',FV],["Cebolla",1,'ud',FV]],s:["Lava y trocea la lechuga, el tomate y el pepino.","Ralla la zanahoria y corta la cebolla en aros.","Aliña con aceite de oliva y vinagre."]},
{id:65,m:'p',t:'verdura',e:'🥘',n:"Salteado de verduras",min:20,i:[["Calabacín",1,'ud',FV],["Pimiento rojo",1,'ud',FV],["Cebolla",1,'ud',FV],["Zanahoria",1,'ud',FV]],s:["Corta las verduras en tiras.","Saltéalas 12 minutos a fuego medio.","Sazona con sal y pimienta."]},
{id:66,m:'p',t:'verdura',e:'🥦',n:"Brócoli y patata al vapor",min:25,i:[["Brócoli",400,'g',FV],["Patata",2,'ud',FV]],s:["Cuece la patata en trozos 8 minutos al vapor.","Añade el brócoli 10 minutos.","Aliña con aceite de oliva."]},
{id:67,m:'p',t:'verdura',e:'🥬',n:"Espinacas con patata",min:25,i:[["Espinacas frescas (bolsa)",300,'g',FV],["Patata",2,'ud',FV],["Ajo",1,'ud',FV]],s:["Cuece la patata en trozos 10 minutos.","Añade las espinacas 3 minutos.","Escurre y sofríe con ajo."]},
{id:68,m:'p',t:'verdura',e:'🥒',n:"Crema de calabacín y puerro",min:30,i:[["Calabacín",2,'ud',FV],["Puerro",1,'ud',FV],["Patata",1,'ud',FV]],s:["Pocha el puerro 5 minutos.","Añade calabacín y patata en trozos y cubre con agua.","Cuece 20 minutos y tritura."]},
// SEGUNDOS (comida)

function frutasDeTemporada(){const m=new Date().getMonth()+1;const l=FRUTAS.filter(f=>f.m.includes(m)).map(f=>f.n);return l.length>=3?l:FRUTAS.map(f=>f.n);}
function frutasSemana(){

}

function archivar(week,menu,n,fruta){

// Coste de un menú entero para n personas (sirve antes de que exista S).
function cantN(q,u,n){const v=q*n/3;return u==='g'?Math.max(10,Math.round(v/10)*10):Math.ceil(v-0.001);}
function costeN(menu,n){
  const m={};
  menu.forEach(d=>['p','s','d'].forEach(k=>MAP[d[k]].i.forEach(i=>{const c=i[0]+'|'+i[2];if(!m[c])m[c]=[i[0],i[2],0];m[c][2]+=i[1];})));
  if(FRUTA)menu.forEach(d=>{const f=FRMAP[d.f];if(f){const c=f.n+'|'+f.u;if(!m[c])m[c]=[f.n,f.u,0];m[c][2]+=f.q;}});
  return Object.values(m).reduce((t,x)=>{const p=PRECIOS[x[0]];if(!p)return t;const q=cantN(x[2],x[1],n);return t+(x[1]==='g'?q/1000*p[0]:q*p[0]);},0);
}
// Cambia platos libres por otros más baratos del mismo tipo, hasta llegar al presupuesto o no poder bajar más.
function abaratar(menu,pins,n,max){
  let c=costeN(menu,n),mejora=true;
  while(mejora&&c>max){
    mejora=false;let bm=null,bc=c;
    for(let i=0;i<7;i++)['p','s','d'].forEach(m=>{
      if(pins[i+'|'+m])return;
      const act=MAP[menu[i][m]],usados=new Set(menu.map(d=>d[m]));
      R.forEach(r=>{
        if(r.m!==m||r.t!==act.t||usados.has(r.id)||esBan(r.id))return;
        const ant=menu[i][m];menu[i][m]=r.id;const cc=costeN(menu,n);menu[i][m]=ant;
        if(cc<bc-0.001){bc=cc;bm=[i,m,r.id];}
      });
    });
    if(bm){menu[bm[0]][bm[1]]=bm[2];c=bc;mejora=true;}
  }
  return c;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function adj(p){for(let i=1;i<p.length;i++)if(p[i]===p[i-1])return true;return false;}
function patron(base){let p,k=0;do{p=shuffle(base.slice());k++;}while(adj(p)&&k<300);return p;}
// Elige una receta al azar. Los favoritos pesan el triple.
function elegir(c){
  const w=c.map(r=>esFav(r.id)?3:r.id>=1000?2:1);
  let x=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let k=0;k<c.length;k++){x-=w[k];if(x<0)return c[k];}
  return c[c.length-1];
}
function pickRec(m,tipo,usados,evitar){
  const base=r=>r.m===m&&!usados.has(r.id);
  let c=R.filter(r=>base(r)&&r.t===tipo&&!esBan(r.id)&&!evitar.has(r.id));
  if(!c.length)c=R.filter(r=>base(r)&&r.t===tipo&&!esBan(r.id));
  if(!c.length)c=R.filter(r=>base(r)&&r.t===tipo&&!evitar.has(r.id));
  if(!c.length)c=R.filter(r=>base(r)&&r.t===tipo);
  if(!c.length)c=R.filter(base);
  const r=elegir(c);
  usados.add(r.id);return r.id;
}
function lunes(){
  const d=new Date();d.setHours(12,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Tipos de cada día para un momento (p, s o d). Los platos fijados mantienen su tipo y descuentan del reparto.
function tiposDe(m,fijos){
  const resto=BASE[m].slice();
  Object.keys(fijos).forEach(i=>{
    const k=resto.indexOf(MAP[fijos[i]].t);
    if(k>=0)resto.splice(k,1);else if(resto.length)resto.splice(Math.floor(Math.random()*resto.length),1);
  });
  shuffle(resto);
  const libres=[0,1,2,3,4,5,6].filter(i=>!(i in fijos));
  return [0,1,2,3,4,5,6].map(i=>i in fijos?MAP[fijos[i]].t:resto[libres.indexOf(i)]);
}
function fallos(pp,ps,pd){
  let v=0;
  [pp,ps,pd].forEach(a=>{for(let i=1;i<7;i++)if(a[i]===a[i-1])v++;});
  for(let i=0;i<7;i++)if(pd[i]!=='verdura'&&ps[i]===pd[i])v+=3; // el segundo y la cena del mismo día no repiten proteína
  return v;
}
// pins: {'dia|momento': idReceta}. Esos platos se quedan y el resto se genera de nuevo.
function generar1(prev,pins){
  const fijos={p:{},s:{},d:{}};
  Object.keys(pins||{}).forEach(k=>{const[i,m]=k.split('|');if(fijos[m]&&MAP[pins[k]])fijos[m][+i]=pins[k];});
  let mejor=null,mejorV=1e9;
  for(let k=0;k<3000&&mejorV>0;k++){
    const t=[tiposDe('p',fijos.p),tiposDe('s',fijos.s),tiposDe('d',fijos.d)];
    const v=fallos(t[0],t[1],t[2]);
    if(v<mejorV){mejor=t;mejorV=v;}
  }
  const[pp,ps,pd]=mejor;
  const up=new Set(Object.values(fijos.p)),us=new Set(Object.values(fijos.s)),ud=new Set(Object.values(fijos.d));
  const ev=(c)=>{const st=new Set((prev||[]).map(d=>d[c]).filter(Boolean));Object.keys(HIST).sort().reverse().slice(0,2).forEach(w=>HIST[w].menu.forEach(d=>{if(MAP[d[c]])st.add(d[c]);}));return st;};
  const ep=ev('p'),es=ev('s'),ed=ev('d');
  return pp.map((t,i)=>({
    p:i in fijos.p?fijos.p[i]:pickRec('p',t,up,ep),
    s:i in fijos.s?fijos.s[i]:pickRec('s',ps[i],us,es),
    d:i in fijos.d?fijos.d[i]:pickRec('d',pd[i],ud,ed)
  }));
}
function conFrutas(m){const fr=frutasSemana();m.forEach((d,i)=>{d.f=fr[i];});return m;}
function generate(prev,pins,max,n){
  if(!(max>0))return conFrutas(generar1(prev,pins));
  n=n||3;
  let mejor=null,mc=1e9;
  for(let k=0;k<60;k++){const m=conFrutas(generar1(prev,pins));const c=costeN(m,n);if(c<mc){mejor=m;mc=c;}if(mc<=max)break;}
  if(mc>max)abaratar(mejor,pins||{},n,max);
  return mejor;
}

function lineaIng(i){const u=i[2];return i[0]+' · '+cant(i[1],u)+(u==='g'?'':' ud')+(PRECIOS[i[0]]?'':' (sin precio)');}

  const fruta=i=>{const f=FRMAP[S.menu[i].f];if(!FRUTA||!f)return '';return `<div class="slot"><div class="info"><span class="lbl">Postre</span><span class="nm">${f.e} ${f.n}</span><span class="mn">${cant(f.q,f.u)}${f.u==='g'?'':' ud'} · ≈ ${eur(coste(f.n,f.q,f.u))}</span></div><button class="sw" data-fswap="${i}" aria-label="Cambiar fruta">↻</button></div>`;};

}

function agregar(){
  const mapa={};
  S.menu.forEach(d=>['p','s','d'].forEach(m=>{
    MAP[d[m]].i.forEach(i=>{
      const k=i[0]+'|'+i[2];
      if(!mapa[k])mapa[k]={n:i[0],u:i[2],c:i[3],q:0};
      mapa[k].q+=i[1];
    });
  }));
  if(FRUTA)S.menu.forEach(d=>{const f=FRMAP[d.f];if(f){const k=f.n+'|'+f.u;if(!mapa[k])mapa[k]={n:f.n,u:f.u,c:FV,q:0};mapa[k].q+=f.q;}});
  return Object.values(mapa);
}
const clave=x=>x.n+'|'+x.u;
const marcaPrecio=n=>PRECIOS[n]&&PRECIOS[n][1]?'~':'';
const precioTxt=x=>PRECIOS[x.n]?marcaPrecio(x.n)+eur(coste(x.n,x.q,x.u)):'sin precio';
function costeCompra(){return agregar().filter(x=>!S.tengo[clave(x)]).reduce((s,x)=>s+coste(x.n,x.q,x.u),0);}
function renderCompra(){
  const todos=agregar();
  const items=todos.filter(x=>!S.tengo[clave(x)]);
  const casa=todos.filter(x=>S.tengo[clave(x)]);
  const marcados=items.filter(x=>S.checked[clave(x)]).length;
  const total=items.reduce((s,x)=>s+coste(x.n,x.q,x.u),0);
  const ahorro=casa.reduce((s,x)=>s+coste(x.n,x.q,x.u),0);
  let h=`<div class="bar"><button class="btn p" id="share">Compartir lista</button><button class="btn" id="unck">Desmarcar todo</button></div><div class="tot"><div><span class="lbl">A comprar</span><div class="big">${eur(total)}</div></div><div class="pp"><span class="lbl">En el carro</span><div class="big">${marcados}/${items.length}</div></div></div><p class="hint">Para ${S.n} personas. Orden por secciones de Mercadona. Precios del ${PRECIOS_FECHA}. El signo ~ marca un precio estimado. Pulsa 🏠 en lo que ya tienes en casa.${casa.length?' Ya tienes '+eur(ahorro)+' en casa.':''}</p>`;
  ORDEN.forEach(cat=>{
    const l=items.filter(x=>x.c===cat).sort((a,b)=>a.n.localeCompare(b.n,'es'));
    if(!l.length)return;
    h+=`<div class="cat">${cat}</div>`+l.map(x=>{const k=clave(x);const ok=S.checked[k];return `<div class="it ${ok?'ok':''}"><label class="itl"><input type="checkbox" data-ck="${k}" ${ok?'checked':''}><span>${x.n}</span><b>${cant(x.q,x.u)}${x.u==='g'?'':' ud'}</b></label><b class="pr">${precioTxt(x)}</b><button class="tg" data-tengo="${k}" aria-label="Ya lo tengo en casa">🏠</button></div>`;}).join('');
  });
  if(!items.length)h+='<p class="hint">No te falta nada. Todo está en casa.</p>';
  if(casa.length){
    h+='<div class="cat">Ya lo tienes en casa</div>'+casa.sort((a,b)=>a.n.localeCompare(b.n,'es')).map(x=>`<div class="it casa"><span>${x.n}</span><b>${cant(x.q,x.u)}${x.u==='g'?'':' ud'}</b><button class="tg" data-tengo="${clave(x)}" aria-label="Volver a la lista">↩</button></div>`).join('');
  }
  h+='<p class="hint">Aceite de oliva, sal y especias no se incluyen.</p>';
  document.getElementById('vCompra').innerHTML=h;
}
function textoCompra(){
  const todos=agregar();
  const items=todos.filter(x=>!S.tengo[clave(x)]);
  const casa=todos.filter(x=>S.tengo[clave(x)]);
  let t='Lista de la compra (Mercadona)\n';
  ORDEN.forEach(cat=>{
    const l=items.filter(x=>x.c===cat).sort((a,b)=>a.n.localeCompare(b.n,'es'));
    if(!l.length)return;
    t+='\n'+cat.toUpperCase()+'\n'+l.map(x=>'- '+x.n+': '+cant(x.q,x.u)+(x.u==='g'?'':' ud')+' ('+precioTxt(x)+')').join('\n')+'\n';
  });
  t+='\nTotal aproximado a comprar: '+eur(costeCompra())+' para '+S.n+' personas';
  if(casa.length)t+='\nYa en casa: '+casa.map(x=>x.n).join(', ');
  return t;
}
function toggleTengo(k){

function pinsActuales(){

function togglePin(k){
  if(S.pin[k]){delete S.pin[k];toast('Plato libre otra vez.');}
  else{S.pin[k]=1;toast('Plato fijado. Se mantiene en Nuevo menú.');}
  save();renderMenu();
}
function cambiar(i,m){
  if(S.pin[i+'|'+m]){toast('Este plato está fijado. Quita el pin para cambiarlo.');return false;}
  const usados=new Set(S.menu.map(d=>d[m]));
  const actual=MAP[S.menu[i][m]];
  // El segundo y la cena del mismo día no repiten proteína.
  const otro=m==='s'?MAP[S.menu[i].d].t:m==='d'?MAP[S.menu[i].s].t:null;
  const libre=r=>!otro||r.t==='verdura'||r.t!==otro;
  let c=R.filter(r=>r.m===m&&r.t===actual.t&&!usados.has(r.id)&&!esBan(r.id));
  if(!c.length)c=R.filter(r=>r.m===m&&!usados.has(r.id)&&!esBan(r.id)&&libre(r));
  if(!c.length){toast('No hay más platos para cambiar');return false;}
  S.menu[i][m]=elegir(c).id;
  save();renderMenu();return true;
}

// Favoritos y descartados
function marcarFav(id){
  if(esFav(id)){delete PREF.fav[id];}
  else{PREF.fav[id]=1;delete PREF.ban[id];}
  savePrefs();refrescarPrefs(id);
}
function marcarBan(id){
  const r=MAP[id];
  if(esBan(id)){delete PREF.ban[id];savePrefs();refrescarPrefs(id);return;}
  const quedan=R.filter(x=>x.m===r.m&&x.t===r.t&&x.id!==id&&!esBan(x.id)).length;
  const falta=NECESITA[r.m+':'+r.t]||1;
  if(quedan<falta){toast('No se puede descartar. Cada semana necesito '+falta+' platos de este tipo.');return;}
  PREF.ban[id]=1;delete PREF.fav[id];savePrefs();
  // Si el plato está en el menú de esta semana, se cambia por otro.
  let cambios=0;
  S.menu.forEach((d,i)=>{if(d[r.m]===id){delete S.pin[i+'|'+r.m];if(cambiar(i,r.m))cambios++;}});
  refrescarPrefs(id);
  toast(cambios?'Descartado. Lo cambié en el menú.':'Descartado. No volverá a salir.');
}
function refrescarPrefs(id){
  abrir(id);renderMenu();
  if(vista==='vCompra')renderCompra();

}

  if(v==='vCompra')renderCompra();
  if(v==='vRecetas')renderRecetas(document.getElementById('q')?document.getElementById('q').value:'');
  window.scrollTo(0,0);
}

  if(t.closest('#histBtn')){abrirHist();return;}

  if(t.id==='histBack'){abrirHist();return;}
  const hu=t.closest('[data-histuse]');if(hu){pedirUsarHist(hu.dataset.histuse);return;}
  if(t.id==='histUseOk'){usarHist(t.dataset.w);return;}
  if(t.closest('#frutaBtn')){alternarFruta();return;}
  const fs=t.closest('[data-fswap]');if(fs){cambiarFruta(+fs.dataset.fswap);return;}
  if(t.closest('#presBtn')){abrirPres();return;}
  if(t.id==='presOk'){guardarPres(false);return;}
  if(t.id==='presQ'){guardarPres(true);return;}
  if(t.closest('#nube')){abrirNube();return;}
  if(t.id==='conectar'){conectarNube();return;}
  if(t.id==='desconectar'){desconectarNube();return;}
  if(t.id==='sincronizar'){cerrar();toast('Sincronizando...');poll();return;}

});

function guardarReceta(){
  const g=i=>document.getElementById(i);
  const id=+g('rid').value||0;
  const n=lt(g('rn').value);
  if(n.length<2){toast('Escribe el nombre de la receta');return;}
  const m=g('rm').value,t=g('rt').value;
  const min=Math.round(parseFloat(g('rmin').value))||30;
  const ing=[];let mal='';
  document.querySelectorAll('#ri .ir').forEach(f=>{
    const nom=ln(f.querySelector('.in').value),qs=f.querySelector('.iq').value;
    if(!nom&&!qs)return;
    const q=parseFloat(String(qs).replace(',','.'));
    if(!nom||!(q>0)){mal=mal||(nom||'un ingrediente');return;}
    ing.push([nom,q,f.querySelector('.iu').value,CATMAP[nom]||OTROS]);
  });
  if(mal){toast('Revisa la cantidad de '+mal);return;}
  if(!ing.length){toast('Añade al menos un ingrediente');return;}
  const pasos=g('rs').value.split('\n').map(lt).filter(Boolean);
  if(!pasos.length){toast('Escribe al menos un paso');return;}
  const rec=limpiaReceta({id:id||Date.now(),m,t,n,min,i:ing,s:pasos});
  if(!rec){toast('No se pudo guardar. Revisa los datos.');return;}
  if(PROPIAS[rec.id]){const k=R.findIndex(x=>x.id===rec.id);R[k]=rec;MAP[rec.id]=rec;PROPIAS[rec.id]=rec;}else addPropia(rec);
  savePropias();cerrar();
  renderMenu();if(vista==='vCompra')renderCompra();
  renderRecetas(document.getElementById('q')?document.getElementById('q').value:'');
  const sp=rec.i.filter(x=>!PRECIOS[x[0]]).length;
  toast(sp?'Receta guardada. '+sp+(sp===1?' ingrediente sin precio.':' ingredientes sin precio.'):'Receta guardada');
}

  const r=MAP[id];
  document.getElementById('sheet').innerHTML='<h2>¿Borrar esta receta?</h2><p class="mn" style="font-size:.95rem;margin:8px 0 16px">'+r.n+'. Si está en el menú, se cambia por otro plato.</p><div class="bar"><button class="btn" data-close="1">Cancelar</button><button class="btn p" id="borrarOk" data-id="'+id+'">Borrar</button></div>';

function borrarPropia(id){
  const r=MAP[id];if(!r)return;
  ['p','s','d'].forEach(m=>S.menu.forEach((d,i)=>{
    if(d[m]===id){delete S.pin[i+'|'+m];d[m]=pickRec(m,r.t,new Set(S.menu.map(x=>x[m])),new Set());}
  }));
  quitaPropia(id);delete PREF.fav[id];delete PREF.ban[id];
  save();savePrefs();savePropias();cerrar();
  renderMenu();if(vista==='vCompra')renderCompra();
  renderRecetas(document.getElementById('q')?document.getElementById('q').value:'');
  toast('Receta borrada');
}

function repararMenu(){
  let c=false;
  ['p','s','d'].forEach(m=>S.menu.forEach((d,i)=>{
    if(!MAP[d[m]]){d[m]=pickRec(m,BASE[m][0],new Set(S.menu.map(x=>x[m])),new Set());delete S.pin[i+'|'+m];c=true;}
  }));
  return c;
}
function cambiarFruta(i){
  const L=frutasDeTemporada(),act=S.menu[i].f;
  const vec=[S.menu[i-1]&&S.menu[i-1].f,S.menu[i+1]&&S.menu[i+1].f];
  let c=L.filter(x=>x!==act&&!vec.includes(x));if(!c.length)c=L.filter(x=>x!==act);if(!c.length)return;
  S.menu[i].f=c[Math.floor(Math.random()*c.length)];
  save();renderMenu();if(vista==='vCompra')renderCompra();
}
function alternarFruta(){
  setFruta(!FRUTA);save();renderMenu();if(vista==='vCompra')renderCompra();
  toast(FRUTA?'Fruta de postre activada':'Sin fruta de postre');
}
const fSem=w=>{const p=w.split('-');return p[2]+'/'+p[1];};
const nomPlato=id=>MAP[id]?MAP[id].e+' '+MAP[id].n:'Receta borrada';
function abrirHist(){
  const k=Object.keys(HIST).sort().reverse();
  document.getElementById('sheet').innerHTML='<button class="x" data-close="1" aria-label="Cerrar">✕</button><h2>🕘 Historial</h2>'+(k.length
    ?'<p class="mn" style="font-size:.95rem;margin:8px 0 10px">Pulsa una semana para ver sus platos.</p>'+k.map(w=>'<div class="rc" data-hist="'+w+'"><span>Semana del '+fSem(w)+'</span><span class="mn">'+eur(HIST[w].coste)+' · '+HIST[w].n+' pers.</span></div>').join('')
    :'<p class="mn" style="font-size:.95rem;margin:8px 0 16px">Aún no hay semanas guardadas. Cada lunes se guarda el menú de la semana anterior.</p>');
  document.getElementById('modal').classList.add('on');
}
function verHist(w){
  const e=HIST[w];if(!e){abrirHist();return;}
  document.getElementById('sheet').innerHTML='<button class="x" data-close="1" aria-label="Cerrar">✕</button><h2>Semana del '+fSem(w)+'</h2><div class="mn">'+eur(e.coste)+' · '+e.n+' personas</div>'
    +e.menu.map((d,i)=>'<h4>'+DIAS[i]+'</h4><ul style="list-style:none;padding:0"><li>'+nomPlato(d.p)+'</li><li>'+nomPlato(d.s)+'</li><li>'+nomPlato(d.d)+' (cena)</li>'+(e.fruta&&FRMAP[d.f]?'<li>'+FRMAP[d.f].e+' '+d.f+'</li>':'')+'</ul>').join('')
    +'<div class="bar" style="margin-top:16px"><button class="btn" id="histBack">Volver</button><button class="btn p" data-histuse="'+w+'">Usar este menú</button></div>';
}
function pedirUsarHist(w){
  document.getElementById('sheet').innerHTML='<h2>¿Usar este menú?</h2><p class="mn" style="font-size:.95rem;margin:8px 0 16px">El menú de esta semana pasa a ser el de la semana del '+fSem(w)+'. Se borran las marcas de la lista de la compra y los pines.</p><div class="bar"><button class="btn" data-close="1">Cancelar</button><button class="btn p" id="histUseOk" data-w="'+w+'">Usar menú</button></div>';
}
function usarHist(w){
  const e=HIST[w];if(!e)return;
  S.menu=e.menu.map(d=>({p:d.p,s:d.s,d:d.d,f:d.f}));
  repararMenu();asegurarFrutas(S.menu);
  S.checked={};S.tengo={};S.pin={};
  save();cerrar();renderMenu();if(vista==='vCompra')renderCompra();
  window.scrollTo(0,0);toast('Menú puesto en esta semana');
}
function crearMenuNuevo(){
  S.menu=generate(S.menu,pinsActuales(),S.max,S.n);S.checked={};S.tengo={};save();renderMenu();
  if(vista==='vCompra')renderCompra();
  window.scrollTo(0,0);
  toast(S.max>0&&costeSemana()>S.max+0.005?'No llego a '+eur(S.max)+'. Este es el menú más barato que encontré.':'Menú nuevo creado');
}
// Confirmación dentro de la app: el aviso nativo (confirm) falla en algunos móviles.
document.getElementById('nuevo').addEventListener('click',()=>{
  const nf=Object.keys(pinsActuales()).length;
  document.getElementById('sheet').innerHTML=nf>=21
    ?'<h2>Todos los platos están fijados</h2><p class="mn" style="font-size:.95rem;margin:8px 0 16px">Quita el pin de algún plato para crear un menú nuevo.</p><div class="bar"><button class="btn p" data-close="1">Entendido</button></div>'
    :'<h2>¿Crear un menú nuevo?</h2><p class="mn" style="font-size:.95rem;margin:8px 0 16px">'+(nf?'Cambian todos los platos de la semana menos los '+nf+' fijados.':'Cambian todos los platos de la semana.')+(S.max>0?' Intento no pasar de '+eur(S.max)+'.':'')+' Se borran las marcas de la lista de la compra.</p><div class="bar"><button class="btn" data-close="1">Cancelar</button><button class="btn p" id="okNuevo">Crear menú</button></div>';
  document.getElementById('modal').classList.add('on');
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(SYNC.code)poll();else if(S.week!==lunes())renovar();});
const sel=document.getElementById('pers');
[2,3,4,5].forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n+' pers.';if(n===S.n)o.selected=true;sel.appendChild(o);});
sel.addEventListener('change',()=>{S.n=+sel.value;save();renderMenu();if(vista==='vCompra')renderCompra();});

// ===== Compartir con la familia (Firebase Realtime Database por REST) =====
// Los datos viven en /menuSemanal/<código>. Cada móvil empuja sus cambios
// y cada 5 segundos lee lo que han hecho los demás.
const fbBase=()=>FB_URL+'/menuSemanal/'+encodeURIComponent(SYNC.code);
const fbKey=k=>String(k).replace(/[.$#\[\]\/]/g,'_');
const mapa=(o,pre)=>{const r={};Object.keys(o||{}).forEach(k=>{r[(pre||'')+fbKey(k)]=1;});return r;};

function snapshot(){
  const menu={};S.menu.forEach((d,i)=>{menu['d'+i]=d.f?{p:d.p,s:d.s,d:d.d,f:d.f}:{p:d.p,s:d.s,d:d.d};});
  return{plan:{week:S.week,n:S.n,menu,max:S.max||0,fr:FRUTA?1:0},checked:mapa(S.checked),tengo:mapa(S.tengo),pin:mapa(S.pin),fav:mapa(PREF.fav,'r'),ban:mapa(PREF.ban,'r'),own:ownSnap(),hist:histSnap()};
}
async function fb(method,path,body){
  const r=await fetch(fbBase()+path+'.json'+(method==='GET'?'':'?print=silent'),{
    method,
    headers:body!==undefined?{'Content-Type':'application/json'}:undefined,
    body:body!==undefined?JSON.stringify(body):undefined
  });
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e;}
  return method==='GET'?r.json():null;
}
function mensajeError(e){return(e&&(e.status===401||e.status===403))?'Permiso denegado. Revisa las reglas de Firebase.':'Sin conexión. Los cambios se enviarán al volver.';}
function estadoNube(est,msg){SYNC.estado=est;SYNC.msg=msg||'';pintarNube();}
function pintarNube(){
  const b=document.getElementById('nube');if(!b)return;
  b.textContent=SYNC.estado==='ok'?'☁️✓':SYNC.estado==='error'?'☁️!':'☁️';
  b.title=SYNC.estado==='ok'?'Sincronizado':SYNC.estado==='error'?SYNC.msg:'Compartir con la familia';
}

// Empuja los cambios locales: compara con lo último que se sabe del servidor.
async function sync(){
  if(!SYNC.code||!SYNC.listo||SYNC.adoptando)return;
  const nuevo=snapshot(),viejo=SYNC.remoto||{plan:null,checked:{},tengo:{},pin:{},fav:{},ban:{},own:{},hist:{}};
  const ops=[];
  if(JSON.stringify(nuevo.plan)!==JSON.stringify(viejo.plan))ops.push(['PUT','/plan',nuevo.plan]);
  ['checked','tengo','pin','fav','ban'].forEach(c=>{
    const a=nuevo[c],b=viejo[c]||{};
    const ka=Object.keys(a),kb=Object.keys(b);
    if(!ka.length&&kb.length){ops.push(['DELETE','/'+c]);return;}
    ka.forEach(k=>{if(!b[k])ops.push(['PUT','/'+c+'/'+encodeURIComponent(k),1]);});
    kb.forEach(k=>{if(!a[k])ops.push(['DELETE','/'+c+'/'+encodeURIComponent(k)]);});
  });
  {const a=nuevo.own,b=viejo.own||{},ka=Object.keys(a),kb=Object.keys(b);
    if(!ka.length&&kb.length)ops.push(['DELETE','/own']);
    else{ka.forEach(k=>{if(b[k]!==a[k])ops.push(['PUT','/own/'+encodeURIComponent(k),a[k]]);});kb.forEach(k=>{if(!a[k])ops.push(['DELETE','/own/'+encodeURIComponent(k)]);});}}
  {const a=nuevo.hist,b=viejo.hist||{},ka=Object.keys(a),kb=Object.keys(b);
    if(!ka.length&&kb.length)ops.push(['DELETE','/hist']);
    else{ka.forEach(k=>{if(b[k]!==a[k])ops.push(['PUT','/hist/'+encodeURIComponent(k),a[k]]);});kb.forEach(k=>{if(!a[k])ops.push(['DELETE','/hist/'+encodeURIComponent(k)]);});}}
  if(!ops.length)return;
  SYNC.remoto=nuevo;SYNC.tw=Date.now();SYNC.pend++;
  try{await Promise.all(ops.map(o=>fb(o[0],o[1],o[2])));estadoNube('ok');}
  catch(e){SYNC.sucio=true;saveSync();estadoNube('error',mensajeError(e));}
  finally{SYNC.pend--;}
}

// Aplica lo que hay en el servidor. En la primera conexión se unen los favoritos y descartados.
function adoptar(r,primera){
  const sacar=(o,pre)=>{const x={};Object.keys(o||{}).forEach(k=>{if(!pre)x[k]=1;else if(k[0]===pre)x[k.slice(1)]=1;});return x;};
  const ownAntes=JSON.stringify(ownSnap());
  adoptarPropias(r.own,primera);
  adoptarHist(r.hist);
  if(r.plan&&r.plan.week&&r.plan.week>S.week)archivar(S.week,S.menu,S.n,FRUTA);
  const plan=r.plan;let menu=null;
  if(plan&&plan.menu){
    const arr=[];
    for(let i=0;i<7;i++){const d=plan.menu['d'+i];if(!d||!MAP[d.p]||!MAP[d.s]||!MAP[d.d]){arr.length=0;break;}arr.push({p:d.p,s:d.s,d:d.d,f:FRMAP[d.f]?d.f:null});}
    if(arr.length===7)menu=arr;
  }
  const antes=JSON.stringify(snapshot());
  SYNC.adoptando=true;
  if(menu)S.menu=menu;
  if(plan&&plan.fr!==undefined)setFruta(+plan.fr);
  asegurarFrutas(S.menu);
  repararMenu();
  if(plan&&/^\d{4}-\d{2}-\d{2}$/.test(String(plan.week)))S.week=plan.week;
  if(plan&&[2,3,4,5].includes(+plan.n))S.n=+plan.n;
  if(plan&&plan.max!==undefined)S.max=+plan.max>0?Math.round(+plan.max):0;
  S.checked=sacar(r.checked);S.tengo=sacar(r.tengo);S.pin=sacar(r.pin);
  if(primera){PREF.fav=Object.assign(sacar(r.fav,'r'),PREF.fav);PREF.ban=Object.assign(sacar(r.ban,'r'),PREF.ban);}
  else{PREF.fav=sacar(r.fav,'r');PREF.ban=sacar(r.ban,'r');}
  save();savePrefs();
  SYNC.adoptando=false;
  SYNC.remoto={plan:plan?{week:plan.week,n:+plan.n,menu:plan.menu,max:plan.max===undefined?undefined:S.max,fr:plan.fr===undefined?undefined:(FRUTA?1:0)}:null,checked:mapa(r.checked),tengo:mapa(r.tengo),pin:mapa(r.pin),fav:mapa(sacar(r.fav,'r'),'r'),ban:mapa(sacar(r.ban,'r'),'r'),own:ownRemoto(r.own),hist:histRemoto(r.hist)};
  const cambio=JSON.stringify(snapshot())!==antes||ownAntes!==JSON.stringify(ownSnap());
  if(cambio){
    sel.value=String(S.n);
    renderMenu();
    if(vista==='vCompra')renderCompra();
    if(vista==='vRecetas')renderRecetas(document.getElementById('q')?document.getElementById('q').value:'');
  }
}

async function poll(){
  if(!SYNC.code||SYNC.polling)return;
  SYNC.polling=true;
  try{
    const r=await fb('GET','');
    // Si acabas de tocar algo, espera al siguiente turno para no pisar tu cambio.
    if(SYNC.pend>0||Date.now()-SYNC.tw<3000)return;
    if(SYNC.sucio||r===null){
      const s=snapshot();await fb('PUT','',s);
      SYNC.remoto=s;SYNC.sucio=false;saveSync();SYNC.listo=true;SYNC.primera=false;estadoNube('ok');
    }else{
      const primera=SYNC.primera;
      adoptar(r,primera);SYNC.listo=true;SYNC.primera=false;estadoNube('ok');
      sync(); // sube lo propio que el servidor no tenía (favoritos, recetas, historial)
    }
    if(S.week!==lunes())renovar();
  }catch(e){
    estadoNube('error',mensajeError(e));
    if(S.week!==lunes())renovar();
  }finally{SYNC.polling=false;}
}

function abrirNube(){
  const sh=document.getElementById('sheet');
  if(!SYNC.code){
    sh.innerHTML='<h2>☁️ Compartir con la familia</h2><p class="mn" style="font-size:.95rem;margin:8px 0 12px">Escribe el mismo código en los móviles de tu familia. Verán el mismo menú, la misma lista y lo que marquéis en el carro.</p><input id="codigo" type="text" placeholder="Ejemplo: casa-rodriguez-4821" autocapitalize="off" autocomplete="off" spellcheck="false"><p class="mn" style="margin:8px 0 14px">Elige un código difícil de adivinar. Quien lo conozca puede ver y cambiar el menú.</p><div class="bar"><button class="btn" data-close="1">Cancelar</button><button class="btn p" id="conectar">Conectar</button></div>';
  }else{
    const txt=SYNC.estado==='ok'?'Todo sincronizado.':SYNC.estado==='error'?SYNC.msg:'Conectando...';
    sh.innerHTML='<h2>☁️ Conectado</h2><p class="mn" style="font-size:.95rem;margin:8px 0">Código: <b>'+SYNC.code+'</b></p><p class="mn" style="font-size:.95rem;margin:0 0 14px">'+txt+'</p><div class="bar"><button class="btn" id="sincronizar">Sincronizar ahora</button><button class="btn" id="desconectar">Desconectar</button></div><button class="btn" data-close="1" style="width:100%;margin-top:8px">Cerrar</button>';
  }
  document.getElementById('modal').classList.add('on');
}
function conectarNube(){
  const v=(document.getElementById('codigo').value||'').trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
  if(v.length<6){toast('El código necesita 6 caracteres o más');return;}
  SYNC.code=v;SYNC.listo=false;SYNC.sucio=false;SYNC.remoto=null;SYNC.primera=true;saveSync();
  estadoNube('conectando');cerrar();toast('Conectando...');poll();
}
function desconectarNube(){
  SYNC.code='';SYNC.listo=false;SYNC.sucio=false;SYNC.remoto=null;SYNC.primera=false;saveSync();
  estadoNube('off');cerrar();toast('Desconectado. Tus datos se quedan en este móvil.');
}

renderMenu();
if(renovado)toast('Menú nuevo de esta semana');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
pintarNube();
if(SYNC.code)poll();
setInterval(()=>{if(!document.hidden&&SYNC.code)poll();},5000);
</script>
